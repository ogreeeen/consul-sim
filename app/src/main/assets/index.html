<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>コンサル転職シミュレーター</title>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--mut:#6b7385;--navy:#14284b;--acc:#c9a227;--ok:#1f8a4c;--ng:#c0392b;--line:#e3ddd0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .scr{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto}
  .scr.on{display:flex}
  .wrap{width:100%;max-width:640px;margin:0 auto;padding:18px 16px 28px}
  header.top{background:var(--navy);color:#fff;padding:14px 16px;font-weight:800;letter-spacing:.05em}
  header.top small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
  h1{font-size:22px;margin:8px 0 6px}
  .lead{color:var(--mut);font-size:14px;margin:0 0 18px;line-height:1.6}
  label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px;font-weight:700}
  input{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:17px;background:#fff}
  .unit{display:flex;align-items:center;gap:8px} .unit span{color:var(--mut);white-space:nowrap}
  .btn{display:block;width:100%;margin-top:18px;padding:15px;border:none;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-size:17px;font-weight:800}
  .btn.sub{background:transparent;color:var(--navy);border:2px solid var(--navy);margin-top:10px;font-size:15px;padding:12px}
  .firm{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font:inherit}
  .firm b{font-size:17px;display:block}
  .firm .meta{font-size:12px;color:var(--mut);margin-top:3px}
  .cat{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:1px 7px;margin-right:6px;vertical-align:2px}
  .cat.strategy{background:#7a1f2b} .cat.general{background:#1f4e8a} .cat.domestic{background:#2d6a3e} .cat.it{background:#5b3f8a}
  .star{color:var(--acc);letter-spacing:1px}
  /* 面接画面 */
  .ihead{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .ihead .av{font-size:30px}
  .ihead b{display:block;font-size:15px} .ihead small{font-size:12px;opacity:.8}
  .prog{height:5px;background:#203a66} .prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
  #chat{flex:1;overflow-y:auto;padding:14px 14px 8px}
  .msg{max-width:88%;padding:11px 14px;border-radius:14px;margin:8px 0;line-height:1.6;font-size:16px;white-space:pre-wrap;animation:pop .25s}
  .msg.q{background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
  .msg.a{background:var(--navy);color:#fff;margin-left:auto;border-top-right-radius:4px}
  .msg.r{background:#fff8e1;border:1px dashed var(--acc);font-size:14px;color:#6b5410}
  .step{font-size:12px;color:var(--mut);text-align:center;margin:14px 0 4px;letter-spacing:.1em}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}}
  #opts{padding:10px 14px 18px;background:var(--bg);border-top:1px solid var(--line)}
  #opts button{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:15px;line-height:1.5}
  #opts button:active{border-color:var(--navy)}
  /* 結果 */
  .result{margin:auto;width:100%;max-width:560px;padding:24px 18px;text-align:center}
  .stamp{font-size:54px;font-weight:900;letter-spacing:.1em;margin:4px 0;transform:rotate(-6deg);display:inline-block;border:6px solid;border-radius:14px;padding:4px 22px}
  .stamp.ng{color:var(--ng)} .stamp.ok{color:var(--ok)}
  .box{background:#fff;border-radius:14px;padding:16px;margin-top:18px;text-align:left;line-height:1.7;font-size:15px;border:1px solid var(--line)}
  .box h3{margin:0 0 6px;font-size:14px;color:var(--mut)}
  .big{font-size:30px;font-weight:900;color:var(--navy)}
  .link{display:block;margin-top:8px;padding:10px 12px;border-radius:10px;background:#eef2f8;color:var(--navy);text-decoration:none;font-weight:700;font-size:14px}
  .link.cta{background:#0f8a6d;color:#fff;text-align:center;border-radius:999px;padding:12px}
  /* 面接室 */
  #interview{background:#0f1420}
  .stage{position:relative;height:36vh;min-height:200px;flex:none;overflow:hidden;background:#1a1f2b}
  .scene{position:absolute;inset:0}
  .scene svg{width:100%;height:100%;display:block}
  .shade{position:absolute;inset:0;background:#000;opacity:1;transition:opacity 1.6s;pointer-events:none}
  .vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(120,0,0,0);transition:box-shadow .6s}
  .vign.on{animation:beat 1s infinite}
  @keyframes beat{0%,100%{box-shadow:inset 0 0 60px rgba(150,0,0,.25)}50%{box-shadow:inset 0 0 110px rgba(150,0,0,.55)}}
  .cap{position:absolute;left:0;top:0;padding:6px 10px;color:#fff;background:rgba(10,14,24,.55);border-bottom-right-radius:10px;font-size:11px;line-height:1.3}
  .cap b{display:block;font-size:14px}
  .timer{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.12)}
  .timer i{display:block;height:100%;width:0;background:#c9a227}
  .timer i.low{background:#e74c3c}
  .talk{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  #interview .prog{height:4px;background:#d8d2c4;flex:none}
  #chat{min-height:0}
  #opts{flex:none;max-height:30vh;overflow-y:auto}
  #chat{flex:1 1 auto;min-height:120px}
  #opts button{padding:10px 12px;font-size:14px;margin-top:6px}
  /* 表情とまばたき */
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .head{transition:transform .3s}
  .nod .head{animation:nod .9s 2}
  @keyframes nod{30%{transform:translateY(5px)}60%{transform:translateY(0)}}
  .writing .pen{display:inline;animation:write .5s infinite alternate}
  .pen{display:none}
  @keyframes write{to{transform:translate(8px,2px)}}
  .clockhand{transform-origin:340px 46px;animation:tick 60s steps(60) infinite}
  @keyframes tick{to{transform:rotate(360deg)}}
  @media (orientation: landscape){
    .msg{max-width:80%}
    #interview{flex-direction:row}
    .stage{height:auto;width:46%;min-height:0}
    #opts{max-height:52vh}
  }
</style>
</head>
<body>

<!-- プロフィール -->
<section class="scr on" id="profile">
  <header class="top">コンサル転職シミュレーター<small>※登場する企業はすべて架空です</small></header>
  <div class="wrap">
    <h1>プロフィール</h1>
    <p class="lead">あこがれのコンサルファームに挑戦しよう。ひとつでも地雷を踏んだら、その場で不合格。</p>
    <label>名前</label><input id="pName" maxlength="12" placeholder="山田 太郎">
    <label>年齢</label><div class="unit"><input id="pAge" type="number" inputmode="numeric" placeholder="28"><span>歳</span></div>
    <label>現在の年収</label><div class="unit"><input id="pSal" type="number" inputmode="numeric" placeholder="550"><span>万円</span></div>
    <button class="btn" id="toFirms">応募する企業を選ぶ</button>
  </div>
</section>

<!-- 企業選択 -->
<section class="scr" id="firms">
  <header class="top">応募する企業を選択<small id="who"></small></header>
  <div class="wrap" id="firmList"></div>
</section>

<!-- 面接 -->
<section class="scr" id="interview">
  <div class="stage">
    <div class="scene" id="scene"></div>
    <div class="shade" id="shade"></div>
    <div class="vign" id="vign"></div>
    <div class="cap"><b id="iFirm"></b><small id="iName"></small></div>
    <div class="timer"><i id="timer"></i></div>
  </div>
  <div class="talk">
    <div class="prog"><i id="prog"></i></div>
    <div id="chat"></div>
    <div id="opts"></div>
  </div>
</section>

<!-- 結果 -->
<section class="scr" id="result">
  <div class="result">
    <div id="resStamp"></div>
    <div id="resBody"></div>
    <button class="btn" id="otherFirm">別の企業を受ける</button>
    <button class="btn sub" id="retrySame">同じ企業にもう一度</button>
    <button class="btn sub" id="toProfile">プロフィールを変える</button>
  </div>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const R = () => Math.random();
const pick = a => a[Math.floor(R() * a.length)];
const shuffle = a => a.map(x => [R(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// ================= 企業（すべて架空） =================
// cat: strategy=戦略 / general=総合 / domestic=国内独立系 / it=IT系
const CAT = {strategy:'戦略', general:'総合', domestic:'国内', it:'IT'};
const FIRMS = [
  {id:'mck', n:'マクレイン・アンド・カンパニー', cat:'strategy', star:5, need:16, base:1300, iv:'シニアパートナー 森田',
   note:'世界トップクラスの戦略ファーム。経営トップの最重要課題だけを扱う。',
   special:{at:'motive', t:'御社のロゴのデザインが好きだからです', d:{all:-9}, fail:true, msg:'……ロゴについては、広報に問い合わせてください。'}},
  {id:'bcg', n:'ボストン・ストラテジー・グループ', cat:'strategy', star:5, need:15, base:1250, iv:'マネージングディレクター 高橋',
   note:'米国発の大手戦略ファーム。独自のフレームワークで知られる。',
   special:{at:'motive', t:'御社が発表しているレポートを、毎回読んでいます', d:{all:4}, msg:'……ちなみに、どのレポートが一番でしたか？（少し嬉しそうだ）'}},
  {id:'bain', n:'ブレイン・アンド・パートナーズ', cat:'strategy', star:5, need:15, base:1250, iv:'パートナー 佐伯',

   special:{at:'motive', t:'結果にこだわる御社の文化に共感しました', d:{all:3}, msg:'うちの社是を、よく調べてきましたね。'}},
  {id:'atk', n:'A.D.カーライル', cat:'strategy', star:4, need:14, base:1150, iv:'プリンシパル 松本',
   note:'製造業に強い老舗の戦略ファーム。調達・コスト削減の実績が豊富。',
   special:{at:'motive', t:'御社の年末パーティーが派手だと聞いたからです', d:{all:-9}, fail:true, msg:'……それは、どこで聞いたんですか。本日はお帰りください。'}},
  {id:'rb', n:'ローゼンベルク・ストラテジー', cat:'strategy', star:4, need:14, base:1100, iv:'パートナー 井上',

   special:{at:'motive', t:'スピード感のある環境で、とにかく打席に立ちたいです', d:{all:3}, msg:'いいですね。うちは、打席だけはいくらでもありますよ。'}},
  {id:'dt', n:'デロワ・トーマス コンサルティング', cat:'general', star:3, need:11, base:830, iv:'パートナー 赤井',
   note:'4大会計事務所系の総合ファーム。業界別のチームが厚い。',
   special:{at:'motive', t:'正直、ほかのファームとの違いはよく分かっていません', d:{all:-9}, fail:true, msg:'……では、違いが分かってから、また来てください。'}},

   special:{at:'motive', t:'官公庁の政策づくりに、上流から関わりたいからです', d:{all:4}, msg:'シンクタンクの本丸ですね。'}},

  {id:'ibn', n:'IBCコンサルティング', cat:'it', star:2, need:8, base:750, iv:'理事 合田',
   note:'IT系の老舗。システムとビジネスの両方をつなぐ案件が中心。',
   special:{at:'motive', t:'システムとビジネスの両方が分かる人材になりたいからです', d:{all:5}, msg:'それができる人は、今いちばん足りていません。'}},

// ================= 面接官の見た目 =================
// hair: 髪の色 / long: 長い髪 / gray: 白髪まじり / glasses: メガネ / tie: ネクタイかスカーフの色 / suit: スーツの色
const LOOK = {
  mck:{hair:'#2a2420', gray:true, glasses:true, tie:'#1d3557', suit:'#22262f'},
  bcg:{hair:'#3b2a20', long:true, tie:'#2a9d8f', suit:'#2b2d36'},
  bain:{hair:'#111', glasses:false, tie:'#b22222', suit:'#1e2230'},
  atk:{hair:'#5a3a22', tie:'#e9a400', suit:'#2a2a2a'},
  rb:{hair:'#7a5230', gray:true, tie:'#8b4513', suit:'#30302c'},
  acc:{hair:'#1a1a1a', long:true, glasses:true, tie:'#7b2cbf', suit:'#1f1f27'},
  dt:{hair:'#2b1d14', tie:'#d62828', suit:'#262b35'},
  pwc:{hair:'#444', gray:true, glasses:true, tie:'#4ea8de', suit:'#2d3340'},
  kpgm:{hair:'#1c1c1c', tie:'#0353a4', suit:'#212634'},
  eyy:{hair:'#d4a017', tie:'#ffd60a', suit:'#1b1b1b'},
  nora:{hair:'#3d2b1f', long:true, tie:'#6a994e', suit:'#2e2e2e'},
  bayc:{hair:'#222', glasses:true, tie:'#e76f51', suit:'#283044'},
  ibn:{hair:'#555', gray:true, tie:'#1d4e89', suit:'#232a3a'},
};
const FACE = {
  neutral:{brow:'M178 108 L194 107 M206 107 L222 108', mouth:'M190 146 Q200 148 210 146', eyeY:0},
  smile:{brow:'M178 105 Q186 101 194 104 M206 104 Q214 101 222 105', mouth:'M188 142 Q200 155 212 142', eyeY:0},
  frown:{brow:'M178 103 L194 110 M206 110 L222 103', mouth:'M190 150 Q200 142 210 150', eyeY:1},
  think:{brow:'M178 107 L194 108 M206 108 L222 107', mouth:'M193 147 L207 147', eyeY:4},
  surprise:{brow:'M178 101 Q186 97 194 100 M206 100 Q214 97 222 101', mouth:'M195 147 a5 6 0 1 0 10 0 a5 6 0 1 0 -10 0', eyeY:-1},
};
function sceneSVG(f){
  const k = Object.assign({hair:'#222', tie:'#333', suit:'#252a33'}, LOOK[f.id] || {});
  const skin = '#f0cfb2', short = f.n.replace(/[・（）()].*$/, '').slice(0, 10);
  const hair = k.long
    ? `<path d="M164 118 Q160 70 200 70 Q240 70 236 118 L240 170 Q228 160 226 130 Q220 92 200 90 Q180 92 174 130 Q172 160 160 170 Z" fill="${k.hair}"/>`
    : `<path d="M166 112 Q164 74 200 72 Q236 74 234 112 Q228 92 200 90 Q172 92 166 112 Z" fill="${k.hair}"/>`;
  const gray = k.gray ? `<path d="M168 104 Q170 92 178 88 M232 104 Q230 92 222 88" stroke="#ccc" stroke-width="4" fill="none" opacity=".8"/>` : '';
  const glasses = k.glasses ? `<g fill="none" stroke="#1a1a1a" stroke-width="2"><rect x="177" y="114" width="20" height="14" rx="5"/><rect x="203" y="114" width="20" height="14" rx="5"/><path d="M197 120 L203 120"/></g>` : '';
  return `<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9c3b6"/><stop offset="1" stop-color="#8f897d"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe4f2"/><stop offset="1" stop-color="#8fb3cf"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#wall)"/>
  <rect x="20" y="22" width="92" height="120" fill="url(#win)"/>
  <g stroke="#e9eef2" stroke-width="3" opacity=".85">${Array.from({length: 11}, (_, i) => `<line x1="20" y1="${26 + i * 11}" x2="112" y2="${26 + i * 11}"/>`).join('')}</g>
  <rect x="20" y="22" width="92" height="120" fill="none" stroke="#6e685c" stroke-width="4"/>
  <circle cx="340" cy="46" r="20" fill="#f7f4ee" stroke="#4a4a4a" stroke-width="3"/>
  <line x1="340" y1="46" x2="340" y2="34" stroke="#222" stroke-width="2.5"/>
  <line x1="340" y1="46" x2="350" y2="46" stroke="#222" stroke-width="2.5"/>
  <line class="clockhand" x1="340" y1="48" x2="340" y2="29" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="300" y="96" width="70" height="46" fill="#6b5b45" opacity=".55"/>
  <rect width="400" height="240" fill="url(#lamp)"/>
  <g class="body">
    <path d="M112 240 Q118 172 200 164 Q282 172 288 240 Z" fill="${k.suit}"/>
    <path d="M184 166 L200 204 L216 166 Z" fill="#fafafa"/>
    <path d="M196 170 L204 170 L208 206 L200 216 L192 206 Z" fill="${k.tie}"/>
    <rect x="190" y="150" width="20" height="18" fill="${skin}"/>
  </g>
  <g class="head">
    <ellipse cx="166" cy="124" rx="6" ry="9" fill="${skin}"/><ellipse cx="234" cy="124" rx="6" ry="9" fill="${skin}"/>
    <ellipse cx="200" cy="120" rx="34" ry="40" fill="${skin}"/>
    ${hair}${gray}
    <g id="eyes"><ellipse class="eye" cx="187" cy="121" rx="3.6" ry="4.4" fill="#1d1d1d"/><ellipse class="eye" cx="213" cy="121" rx="3.6" ry="4.4" fill="#1d1d1d"/></g>
    <path id="brows" d="${FACE.neutral.brow}" stroke="#2a211b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M200 124 Q197 134 200 136" stroke="#c9a68a" stroke-width="2" fill="none"/>
    <path id="mouth" d="${FACE.neutral.mouth}" stroke="#7a3b2e" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    ${glasses}
  </g>

// 表情を変える（nod=うなずく / write=メモを取る）
function face(name, opt = {}){
  const sc = $('scene'), f = FACE[name] || FACE.neutral;
  const b = sc.querySelector('#brows'), m = sc.querySelector('#mouth'), e = sc.querySelector('#eyes');
  if (!b) return;
  b.setAttribute('d', f.brow); m.setAttribute('d', f.mouth);
  e.setAttribute('transform', `translate(0 ${f.eyeY})`);
  sc.classList.toggle('writing', !!opt.write);
  sc.classList.remove('nod'); void sc.offsetWidth;
  if (opt.nod) sc.classList.add('nod');
}

// ================= 不合格の条件（プロフィール） =================
// 当てはまった時点で不合格。メッセージはちょっと大げさに
function profileFail(p, f){
  if (f.cat === 'strategy' && p.age >= 31) return `${p.age}歳……。うちの若手パートナーと同い年ですね。\n戦略ファームの「未経験」は30歳までです。`;
  if (f.cat === 'general' && p.age >= 45) return `${p.age}歳の未経験……。\n上司が全員年下になりますが、耐えられますか？　……いえ、こちらが耐えられません。`;
  if (f.cat === 'domestic' && p.age >= 50) return `${p.age}歳ですか。\n当社の社長より年上の方は、ちょっと……。`;
  if (f.cat === 'it' && p.age >= 58) return `${p.age}歳……。\n定年まで、プロジェクトが1本も終わりません。`;
  if (p.age < 22) return `${p.age}歳……？\nまずは学校に行きましょう。`;
  if (p.sal >= 3000) return `年収${p.sal}万円……。\n当社のパートナーより高いです。むしろ、うちを買収しませんか？`;
  if (f.cat === 'strategy' && p.sal >= 1800) return `年収${p.sal}万円は、うちの提示額を超えています。\n年収が下がっても来たい理由を、30文字で説明できますか？　……できませんよね。`;
  if (f.cat === 'strategy' && p.sal < 300) return `年収${p.sal}万円……。\n失礼ですが、今のお仕事で何を学ばれたのでしょうか。`;
  return null;
}

let P = load('profile', {name:'', age:'', sal:''});
$('pName').value = P.name; $('pAge').value = P.age; $('pSal').value = P.sal;
let F = null, score = 0, steps = [], si = 0, history = [], shownSign = false, failedAt = '';

$('toFirms').onclick = () => {
  const name = $('pName').value.trim() || 'あなた';
  const age = parseInt($('pAge').value, 10), sal = parseInt($('pSal').value, 10);
  if (!(age > 0 && age < 120)){ $('pAge').focus(); return; }

function renderFirms(){
  $('who').textContent = `${P.name}（${P.age}歳・年収${P.sal}万円）`;
  const L = $('firmList'); L.innerHTML = '<p class="lead" style="margin-top:6px">どこを受けますか？</p>';
  const done = load('offers', {});
  FIRMS.forEach(f => {
    const b = document.createElement('button'); b.className = 'firm';
    b.innerHTML = `<b>${f.n}${done[f.id] ? '　🎉' : ''}</b><div class="meta"><span class="cat ${f.cat}">${CAT[f.cat]}</span><span class="star">${'★'.repeat(f.star)}${'☆'.repeat(5 - f.star)}</span>　${f.note}</div>`;
    b.onclick = () => start(f);
    L.appendChild(b);
  });
}

function start(f){
  F = f; score = 0; si = 0; history = []; shownSign = false;
  const qs = STEPS.find(s => s.key === 'q');
  steps = [];
  STEPS.forEach(s => {
    if (s.key === 'q') shuffle(qs.pool).slice(0, qs.count).forEach((q, i) => steps.push({key:'q', title:`面接質問 ${i + 1}`, q:q.q, opts:q.opts}));
    else steps.push(s);
  });
  $('iFirm').textContent = f.n; $('iName').textContent = `面接官：${f.iv}`;
  $('scene').innerHTML = sceneSVG(f);
  $('shade').style.transition = 'none'; $('shade').style.opacity = 1;
  $('chat').innerHTML = ''; $('opts').innerHTML = '';
  stopTimer();
  show('interview');
  run();
}

function msg(text, cls){
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight; return d;
}
function stepLabel(t){ const d = document.createElement('div'); d.className = 'step'; d.textContent = `― ${t} ―`; $('chat').appendChild(d); }

async function run(){
  // 入室
  msg('（コン、コン。）', 'r');
  await sleep(900);
  msg('「どうぞ」', 'q');
  await sleep(500);
  $('shade').style.transition = 'opacity 1.6s'; $('shade').style.opacity = 0;
  msg('失礼します。', 'a');
  await sleep(1400);
  face('neutral');
  const nm = F.iv.split(' ').pop();
  msg(pick([
    `${P.name}さん、本日はよろしくお願いします。${nm}です。\nまずは簡単に、ご経歴を拝見しますね。`,
    `お待たせしました。${nm}です。今日は${P.name}さんのことを、いろいろ聞かせてください。`,
    `${P.name}さんですね。${nm}と申します。……では、さっそく書類を拝見します。`,
    `${nm}です。今日は時間が限られているので、テンポよくいきましょう。`,
    `どうぞ、おかけください。${nm}です。……緊張していますか？　大丈夫、取って食べたりしませんよ。`,
  ]), 'q');
  face('think', {write: false});
  await sleep(1200);
  msg(`（${P.age}歳、現年収${P.sal}万円……）`, 'r');
  await sleep(1100);
  const pf = profileFail(P, F);
  if (pf){ face('surprise'); await sleep(900); return fail(pf, 'プロフィール'); }
  face('neutral');
  msg(pick(['……なるほど。では、さっそく始めましょう。','ありがとうございます。では、質問に移りますね。','ふむ。……では、いくつか伺います。','わかりました。では本題に入りましょう。']), 'q');
  await sleep(700);
  ask();
}

function ask(){
  $('prog').style.width = (si / steps.length * 100) + '%';
  if (si >= steps.length) return finish();
  const s = steps[si];
  stepLabel(s.title);
  askAsync(s);
}
async function askAsync(s){
  // 資料に目を落とす間。これが地味に怖い
  face('think');
  msg(pick(['（資料に目を落としている……）','（ペンを置いて、こちらを見た）','（しばらく沈黙が流れる……）','（手元のメモを、めくっている）',
    '（面接官が、腕を組んだ）','（壁の時計の秒針の音だけが聞こえる）','（面接官がメガネの位置を直した）','（何かをメモに書き足している）','（面接官が、少し身を乗り出した）']), 'r');
  if (si > 0 && R() < .6) msg(pick(['では、次の質問です。','少し角度を変えますね。','続けますね。','次はこちらを伺います。','では、もう一つ。','ここからが本番ですよ。']), 'q');
  await sleep(1300 + R() * 700);
  face('neutral');
  msg(s.q, 'q');
  let opts = s.opts.slice();
  if (F.special && F.special.at === s.key) opts.splice(Math.floor(R() * (opts.length + 1)), 0, Object.assign({special: true}, F.special, {r: F.special.msg}));
  // 選択肢は毎回ばらばらの順番で（特別な選択肢も紛れ込む）
  opts = shuffle(opts);
  const box = $('opts'); box.innerHTML = '';
  // 質問を読む時間をとってから選択肢を出す
  await sleep(1400);
  opts.forEach(o => {
    const b = document.createElement('button'); b.textContent = o.t;
    b.onclick = () => { stopTimer(); answer(s, o); };
    box.appendChild(b);
  });
  // 選択肢が出て会話欄が狭くなっても、最新の発言が見えるように
  box.scrollTop = 0;
  requestAnimationFrame(() => { $('chat').scrollTop = $('chat').scrollHeight; });
  startTimer();
}

// ---- 回答の制限時間（黙っていると減点。最後は鼓動が聞こえてくる） ----
const LIMIT = 25000;
let timerId = null, timerT0 = 0, warned = false;
function startTimer(){
  stopTimer(); timerT0 = performance.now(); warned = false;
  const bar = $('timer');
  const tick = () => {
    const left = Math.max(0, 1 - (performance.now() - timerT0) / LIMIT);
    bar.style.width = (left * 100) + '%';
    bar.classList.toggle('low', left < .3);
    $('vign').classList.toggle('on', left < .3);
    if (left <= 0 && !warned){
      warned = true; score -= 1;
      face('frown');
      msg(pick(['……（沈黙が続いている）','「……考えがまとまりませんか？」','「沈黙は、コンサルでは減点ですよ」']), 'q');
    }
    timerId = requestAnimationFrame(tick);
  };
  timerId = requestAnimationFrame(tick);
}
function stopTimer(){
  if (timerId) cancelAnimationFrame(timerId);
  timerId = null; $('timer').style.width = '0'; $('vign').classList.remove('on');
}

async function answer(s, o){
  $('opts').innerHTML = '';
  msg(o.t, 'a');
  history.push({step: s.title, a: o.t});
  await sleep(700);
  const failHere = o.fail === true || (Array.isArray(o.fail) && o.fail.includes(F.cat));
  if (failHere){ face('frown'); await sleep(500); return fail(o.r || o.msg, s.title); }
  const d = o.d || {};
  const pts = (d.all || 0) + (d[F.cat] || 0);
  score += pts;
  face(pts >= 3 || o.special && pts > 0 ? 'smile' : pts >= 1 ? 'neutral' : pts === 0 ? 'think' : 'frown', {nod: pts >= 3, write: pts >= 1 && pts < 3});
  const pre = pts >= 3 ? ['なるほど。','いいですね。','ほう。','おっ。','……ふむ。','']
            : pts >= 1 ? ['なるほど。','そうですか。','ふむ。','ええ。','',''] : pts === 0 ? ['……そうですか。','ふうん。','……。',''] : ['……はあ。','……うーん。','……そう来ましたか。',''];
  const post = pts >= 3 ? ['','','その感覚、大事です。','もう少し詳しく聞きたいですね。','うちに向いているかもしれません。']
             : pts >= 1 ? ['','','まあ、悪くはないです。','もう一歩、踏み込んでほしかったですね。'] : pts === 0 ? ['','もう少し具体的だとよかったですね。','……次にいきましょう。'] : ['','……次にいきましょう。','その答えは、正直ちょっと気になります。'];
  const body = Array.isArray(o.r) ? pick(o.r) : (o.r || 'なるほど。');
  const pr = o.special ? '' : pick(pre), po = o.special ? '' : pick(post);
  msg([pr && !body.startsWith(pr.replace('。', '')) ? pr : '', body, po].filter(Boolean).join(''), 'q');
  if (!o.special){
    await sleep(500);
    msg(pick(pts >= 3 ? ['（面接官が深くうなずいた）','（面接官の口元が少しゆるんだ）','（何かを丸で囲んでいる）','（面接官が身を乗り出した）','（ペンが速く動いている）']
      : pts >= 1 ? ['（面接官がメモを取っている）','（小さくうなずいた）','（表情は読めない）','（何かを書き込んでいる）']
      : pts === 0 ? ['（面接官の表情は変わらない）','（ペンが止まった）','（面接官が時計をちらりと見た）','（少しだけ首をかしげた）']
      : ['（面接官がペンを置いた……）','（ため息が聞こえた気がする）','（面接官が書類を一枚めくった）','（眉間にしわが寄った）']), 'r');
    // 調子がいいと、合格サインっぽいことが起きる
    if (pts >= 3 && score >= F.need * .5 && !shownSign && R() < .5){
      shownSign = true;
      await sleep(700);
      msg('💡 合格サイン？：' + pick(['面接官が、入社後の配属の話を始めた。','予定の時間を過ぎても、面接官が質問を続けている。','面接官が、自分の若手時代の失敗談を話し始めた。','「ちなみに、ほかの選考はどのくらい進んでいますか？」と聞かれた。']), 'r');
    }
  }
  await sleep(900);
  si++; ask();
}

async function fail(reason, where){
  stopTimer();
  $('prog').style.width = '100%';
  msg(reason, 'q');
  await sleep(1300);
  msg('（面接官が、書類を静かに閉じた）', 'r');
  $('shade').style.transition = 'opacity 1.4s'; $('shade').style.opacity = .85;
  await sleep(1500);
  $('resStamp').innerHTML = '<div class="stamp ng">不合格</div>';
  $('resBody').innerHTML = `
    <div class="box"><h3>${F.n}　面接官コメント</h3>${esc(reason).replace(/\n/g, '<br>')}</div>
    <div class="box"><h3>落ちたところ</h3>${esc(where)}${history.length ? '<br><span style="color:var(--mut);font-size:13px">あなたの回答：「' + esc(history[history.length - 1].a) + '」</span>' : ''}</div>
    ${tipBox(where)}`;
  show('result');
}

async function finish(){
  await sleep(400);
  if (score < F.need){
    return fail(`本日はありがとうございました。\n……正直に申し上げて、決め手に欠けました。\n（合格ライン ${F.need}点に対して ${score}点）`, '総合評価');
  }
  face('think');
  msg('本日はありがとうございました。……結果は、今お伝えしますね。', 'q');
  await sleep(1800);
  face('smile', {nod: true});
  await sleep(900);
  const age = P.age, bonus = Math.max(0, score - F.need) * 25;
  let offer = F.base + bonus + (F.cat === 'strategy' ? (age - 24) * 30 : (age - 24) * 20);
  offer = Math.round(Math.max(offer, F.base * .8) / 10) * 10;
  const diff = P.sal > 0 ? Math.round((offer / P.sal - 1) * 100) : 0;
  const title = F.cat === 'strategy' ? (age <= 26 ? 'ビジネスアナリスト' : 'アソシエイト') : (age <= 27 ? 'コンサルタント' : age <= 33 ? 'シニアコンサルタント' : 'マネージャー');
  const offers = load('offers', {}); offers[F.id] = {offer, at: Date.now()}; save('offers', offers);
  $('resStamp').innerHTML = '<div class="stamp ok">内定</div>';
  $('resBody').innerHTML = `
    <div class="box"><h3>${F.n}　オファー</h3>
      役職：${title}<br>提示年収：<span class="big">${offer.toLocaleString()}万円</span><br>
      <span style="color:${diff >= 0 ? 'var(--ok)' : 'var(--ng)'};font-weight:700">現年収から ${diff >= 0 ? '+' : ''}${diff}%</span></div>
    <div class="box"><h3>面接官からひとこと</h3>${esc(pick([
      'ようこそ。月曜の朝9時に、パワポを開いて待っていてください。',
      '入社初日から、クライアント先に直行です。スーツは3着用意してください。',
      'おめでとうございます。……ところで、Excelのショートカットはどこまで覚えていますか？',
      '一緒に働けるのを楽しみにしています。睡眠は、今のうちにとっておいてください。',
    ]))}</div>
    <div class="box"><h3>スコア</h3>${score}点（合格ライン ${F.need}点）　内定獲得：${Object.keys(offers).length} / ${FIRMS.length}社</div>
    <div class="box"><h3>本物の選考も受けてみる？</h3>ゲームの内定はここまで。実際のファームの選考対策は、現役コンサルに相談できます。
    <a class="link cta" href="${BLOG}lp">現役コンサルに無料で相談する</a>
    <div style="font-size:12px;color:var(--mut);margin-top:6px">履歴書不要・完全無料・勧誘なし</div></div>`;
  show('result');
}
// 落ちたところ・受かったあとに読む記事（ogumatoshihiro.com）
const BLOG = 'https://ogumatoshihiro.com/';
const TIPS = {
  'プロフィール': [466, '未経験からのコンサル転職、年齢と年収の現実'],
  '現職の職種': [128, '未経験からコンサルに転職するには'],
  '自己PR': [451, '面接の想定問答と、通る答え方'],
  '志望動機': [330, '志望動機の作り方'],
  '面接質問': [347, 'ケース面接の解き方'],
  '逆質問': [37, '面接で評価される逆質問'],
  '総合評価': [451, '面接の想定問答と、通る答え方'],
};
function tipBox(where){
  const key = where.startsWith('面接質問') ? '面接質問' : where;
  const t = TIPS[key] || TIPS['総合評価'];
  return `<div class="box"><h3>本番の対策はこちら</h3>
    <a class="link" href="${BLOG}?p=${t[0]}">📖 ${esc(t[1])}（ブログ）</a>
    <a class="link cta" href="${BLOG}lp">現役コンサルに無料で相談する</a>
    <div style="font-size:12px;color:var(--mut);margin-top:6px">履歴書不要・完全無料・勧誘なし</div></div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('otherFirm').onclick = () => { renderFirms(); show('firms'); };
$('retrySame').onclick = () => start(F);
$('toProfile').onclick = () => show('profile');
function show(id){ document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
</script>
